<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta name="author" content="Alexander Morgan">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="Alexander Morgan">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<link rel="alternate" type="application/rss+xml" title="Alexander Morgan" href="/feed.xml">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{app_css}}">
<script src="{{site_js}}"></script>
<script src="{{fixi_js}}" defer></script>
</head>
<body fx-action="/" fx-trigger="site:navigate" fx-target="#main">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-bar">
    <a class="brand" href="/">Alexander Morgan</a>
    <nav class="site-nav" aria-label="Main">
      <ul class="nav-links">
        <li><a href="/projects"{{current_projects}}>Projects</a></li>
        <li><a href="/publications"{{current_publications}}>Publications</a></li>
        <li><a href="/blog"{{current_blog}}>Blog</a></li>
        <li><a href="/recommendations"{{current_recommendations}}>Recommendations</a></li>
        <li><a href="/cv"{{current_cv}}>CV</a></li>
      </ul>
    </nav>
    <label class="theme-toggle">
      <span class="sr-only">Dark mode</span>
      <input class="switch" type="checkbox" role="switch" checked>
    </label>
  </div>
</header>
{{main}}
<footer class="site-footer">
  <div class="container footer-bar">
    <p>© {{year}} Alexander Morgan</p>
    <nav aria-label="Elsewhere">
      <ul class="footer-links">
        <li><a href="https://x.com/lexandermorgan" target="_blank" rel="noopener">Twitter</a></li>
        <li><a href="https://github.com/alexandermorgan" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/alexander-morgan-4356454/" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="https://scholar.google.com/citations?user=GOo0CYUAAAAJ" target="_blank" rel="noopener">Google Scholar</a></li>
        <li><a href="/feed.xml" type="application/rss+xml">RSS</a></li>
      </ul>
    </nav>
  </div>
</footer>
</body>
</html>
